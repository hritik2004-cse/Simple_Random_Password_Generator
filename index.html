<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Random Password Generator</title>
    <link rel="stylesheet" href="style.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
    />
  </head>
  <body>
    <div class="outer-container">
      <div class="info-div">
        <button id="info">i</button>
        <ul id="info-desc">
          <li class="info-desc-li">Password length must between 10 to 30 characters.</li>
          <li class="info-desc-li">You can choose that you want numbers and symbols.</li>
        </ul>
      </div>
      <h1>Generate a <br /><span class="green-col">Random Password</span></h1>
      <p class="desc">Never use an insecure password again.</p>
      <div class="options-div">
        <div class="input-div">
          <label for="passLength">Password length: </label>
          <input type="text" name="passLength" id="passLength" placeholder="0">
        </div>
        <div class="toggle-main-div">

        </div>
      </div>
      <button id="generatePassBtn">Generate Password</button>
      <p id="error"></p>
      <div id="pass-main-div" class="none">
        <hr />
        <div class="inner-container">
          <div class="password-div">
            <i class="fa-regular fa-copy copy" id="pass1copy"></i>
            <p class="password" id="pass1"></p>
          </div>
          <div class="password-div">
            <i class="fa-regular fa-copy copy" id="pass2copy"></i>
            <p class="password" id="pass2"></p>
          </div>
        </div>
      </div>
    </div>
  </body>
  <script type="module" src="dist/index.js"></script>
</html>
